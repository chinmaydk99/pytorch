name: Create issues for ROCm commits

on:
  workflow_dispatch:
    inputs:
      prev_post_tag:
        description: "Previous IFU post tag"
        required: true
        type: string
      curr_pre_tag:
        description: "Current IFU pre tag"
        required: true
        type: string
      target_repo:
        description: "Target repo for issue creation"
        required: false
        default: "chinmaydk99/pytorch"
        type: string
      project_number:
        description: "GitHub Project number"
        required: false
        default: "7"
        type: string
      project_owner:
        description: "Project owner"
        required: false
        default: "chinmaydk99"
        type: string

permissions:
  contents: read
  issues: write

jobs:
  create-issues:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.IFU_GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch origin --tags --force

      - name: List commits in range
        run: |
          echo "Commits between ${{ inputs.prev_post_tag }} and ${{ inputs.curr_pre_tag }}:"
          git log ${{ inputs.prev_post_tag }}..${{ inputs.curr_pre_tag }} --oneline --no-merges

      - name: Create issues
        env:
          PREV_POST_TAG: ${{ inputs.prev_post_tag }}
          CURR_PRE_TAG: ${{ inputs.curr_pre_tag }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          REPO_NAME: ${{ github.repository }}
        run: |
          echo "Creating issues in ${TARGET_REPO}..."
          
          git log "${PREV_POST_TAG}..${CURR_PRE_TAG}" --format="%H" --no-merges | while read hash; do
            short_hash="${hash:0:7}"
            subject=$(git log -1 --format="%s" "$hash")
            author=$(git log -1 --format="%an" "$hash")
            email=$(git log -1 --format="%ae" "$hash")
            
            echo "Processing ${short_hash}: ${subject}"
            
            # Extract GitHub username from noreply email
            gh_username=""
            if [[ "$email" =~ ^[0-9]+\+([^@]+)@users\.noreply\.github\.com$ ]]; then
              gh_username="${BASH_REMATCH[1]}"
              echo "  Detected GitHub username: ${gh_username}"
            fi
            
            # Write issue body to file
            cat > /tmp/issue_body.md << EOF
          **Commit:** $hash
          **Author:** $author ($email)
          **Link:** [$short_hash](https://github.com/${REPO_NAME}/commit/${hash})

          This commit was made between IFU merges.
          EOF
            
            # Create the issue
            issue_url=$(gh issue create \
              --repo "${TARGET_REPO}" \
              --title "[ROCm Commit] ${short_hash}: ${subject:0:60}" \
              --body-file /tmp/issue_body.md)
            
            echo "  Created: ${issue_url}"
            
            # Try to assign if we have a username
            if [[ -n "${gh_username}" ]]; then
              echo "  Trying to assign to @${gh_username}..."
              if gh issue edit "${issue_url}" --add-assignee "${gh_username}" 2>/dev/null; then
                echo "  ✓ Assigned"
              else
                echo "  ✗ Could not assign, adding comment instead..."
                gh issue comment "${issue_url}" --body "cc @${gh_username} - you authored this commit" || true
              fi
            fi
            
            # Add to project
            if [[ -n "${PROJECT_NUMBER}" ]]; then
              echo "  Adding to project..."
              gh project item-add "${PROJECT_NUMBER}" --owner "${PROJECT_OWNER}" --url "${issue_url}" || echo "  Warning: Failed to add to project"
            fi
            
            sleep 1
          done
          
          echo "Done!"
