name: Create git tags for IFU PRs

on:
  pull_request:
    types: [closed]

permissions:
  contents: write        # create/push tags
  pull-requests: write   # edit PR body

jobs:
  tag-ifu:
    # Only proceed if: merged AND title has both markers
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.title, '[AUTOGENERATED]') &&
      contains(github.event.pull_request.title, 'IFU')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout base repo (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Derive key SHAs (rocm base, upstream main, merge)
        id: shas
        shell: bash
        run: |
          set -euo pipefail
          
          PR_NUM="${{ github.event.pull_request.number }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MERGE_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          # For release branches, local branch is same as remote branch. But, for rocm/pytorch's
          # develop branch, we want to use main branch upstream
          if [ "$BASE_REF" == "develop" ]; then
            BASE_REF="main"
          fi
          
          echo "PR_NUM=$PR_NUM"                           
          echo "BASE_REF=$BASE_REF"                       
          echo "HEAD_SHA=$HEAD_SHA"                       
          echo "MERGE_SHA=$MERGE_SHA"                     
    
          # The ROCm base commit is the first parent of the merge commit that landed the PR
          # (i.e., the base branch tip BEFORE this PR merged).
          ROCM_BASE_SHA=$(git rev-parse "${MERGE_SHA}^1")

          # Add and fetch upstream to identify the upstream/main commit that HEAD integrated.
          git remote add upstream "https://github.com/pytorch/pytorch.git"
          git fetch upstream "$BASE_REF"

          # Heuristic: the upstream commit integrated by the PR's head is the merge-base
          # between the PR head commit and upstream/main as fetched now.
          # This gives you the exact upstream commit (or the best common ancestor) that HEAD included.
          UPSTREAM_MAIN_SHA=$(git merge-base "${HEAD_SHA}" "upstream/$BASE_REF")
          echo "ROCM_BASE_SHA=$ROCM_BASE_SHA"            
          echo "UPSTREAM_MAIN_SHA=$UPSTREAM_MAIN_SHA"     

          
          echo "PR_NUM=$PR_NUM"                           >> "$GITHUB_OUTPUT"
          echo "BASE_REF=$BASE_REF"                       >> "$GITHUB_OUTPUT"
          echo "HEAD_SHA=$HEAD_SHA"                       >> "$GITHUB_OUTPUT"
          echo "MERGE_SHA=$MERGE_SHA"                     >> "$GITHUB_OUTPUT"
          echo "ROCM_BASE_SHA=$ROCM_BASE_SHA"             >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_MAIN_SHA=$UPSTREAM_MAIN_SHA"     >> "$GITHUB_OUTPUT"

      - name: Extract tag base from PR title
        id: tagname
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          # Remove everything up to and including "[AUTOGENERATED]"
          # Remove trailing whitespace
          BASE_TAG=$(echo "$TITLE" | sed -E 's/^\[AUTOGENERATED\][[:space:]]*//' | sed -E 's/[[:space:]]+$//')

          echo "BASE_TAG=$BASE_TAG" 
          echo "PRE_TAG=${BASE_TAG}_pre" 
          echo "POST_TAG=${BASE_TAG}_post" 
          
          echo "BASE_TAG=$BASE_TAG" >> $GITHUB_OUTPUT
          echo "PRE_TAG=${BASE_TAG}_pre" >> $GITHUB_OUTPUT
          echo "POST_TAG=${BASE_TAG}_post" >> $GITHUB_OUTPUT

      - name: Identify previous IFU post tag
        id: prev_tag
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_POST="${{ steps.tagname.outputs.POST_TAG }}"
          # Sort tags newest-first and ignore the tag we are about to create
          LAST_POST=$(git tag --list '*_post' --sort=-creatordate | grep -Fxv "$CURRENT_POST" | head -n 1 || true)

          if [ -z "$LAST_POST" ]; then
            echo "No prior *_post tag found; skipping follow-up issue creation."
            echo "last_post_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Previous post tag detected: $LAST_POST"
            echo "last_post_found=true" >> "$GITHUB_OUTPUT"
            echo "LAST_POST_TAG=$LAST_POST" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pre/post tags 
        shell: bash
        run: |
          set -euo pipefail
          echo "Tagging:"
          echo "  ${{ steps.tagname.outputs.PRE_TAG }}  @ ${{ steps.shas.outputs.ROCM_BASE_SHA }}"
          echo "  ${{ steps.tagname.outputs.POST_TAG }} @ ${{ steps.shas.outputs.MERGE_SHA }}"

          git tag -a "${{ steps.tagname.outputs.PRE_TAG }}"  -m "IFU pre (PR #${{ steps.shas.outputs.PR_NUM }})"  "${{ steps.shas.outputs.ROCM_BASE_SHA }}" 
          git tag -a "${{ steps.tagname.outputs.POST_TAG }}" -m "IFU post (PR #${{ steps.shas.outputs.PR_NUM }})" "${{ steps.shas.outputs.MERGE_SHA }}"

          #Force pushing is safe. If we land a new PR, we'd wanna retag a commit if we have to.
          git push origin "refs/tags/${{ steps.tagname.outputs.PRE_TAG }}" -f
          git push origin "refs/tags/${{ steps.tagname.outputs.POST_TAG  }}" -f

      - name: Gather ROCm-only commits since last IFU
        id: collect_commits
        if: steps.prev_tag.outputs.last_post_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          LAST_POST="${{ steps.prev_tag.outputs.LAST_POST_TAG }}"
          RANGE_END="${{ steps.shas.outputs.ROCM_BASE_SHA }}"

          if ! git rev-parse "$LAST_POST" >/dev/null 2>&1; then
            echo "Unable to resolve last post tag $LAST_POST; skipping follow-up issue creation."
            echo "commit_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t COMMITS < <(git rev-list --no-merges --reverse "$LAST_POST..$RANGE_END")

          if [ "${#COMMITS[@]}" -eq 0 ]; then
            echo "No ROCm-only commits detected between $LAST_POST and $RANGE_END."
            echo "commit_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found ${#COMMITS[@]} ROCm commits between $LAST_POST and $RANGE_END."

          echo '[]' > commits.json
          for sha in "${COMMITS[@]}"; do
            info=$(gh api "repos/${{ github.repository }}/commits/$sha" --jq '{sha: .sha, short: .sha[0:7], title: (.commit.message | split("\n")[0]), date: .commit.author.date, author: {name: .commit.author.name, email: .commit.author.email}, login: (if .author then .author.login else null end)}')
            tmp=$(mktemp)
            jq --argjson commit "$info" '. + [$commit]' commits.json > "$tmp"
            mv "$tmp" commits.json
          done

          echo "commit_count=${#COMMITS[@]}" >> "$GITHUB_OUTPUT"

      # Requires IFU_PROJECT_PAT (repo + project scopes). Override ISSUE_TARGET_REPO /
      # PROJECT_OWNER / PROJECT_NUMBER env vars in this step for dry-run testing.
      - name: Create follow-up issues for ROCm-only commits
        if: steps.prev_tag.outputs.last_post_found == 'true' && steps.collect_commits.outputs.commit_count != '0'
        env:
          GH_TOKEN: ${{ secrets.IFU_PROJECT_PAT }}
          ISSUE_TARGET_REPO: ROCm/pytorch
          PROJECT_OWNER: chinmaydk99
          PROJECT_NUMBER: 7
          FOLLOWUP_LABEL: ifu-followup
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::IFU_PROJECT_PAT is not configured; skipping follow-up issue creation."
            exit 0
          fi

          if [ ! -s commits.json ]; then
            echo "Commit metadata file missing or empty; nothing to do."
            exit 0
          fi

          LABEL="$FOLLOWUP_LABEL"
          TARGET_REPO="$ISSUE_TARGET_REPO"
          PR_NUM="${{ steps.shas.outputs.PR_NUM }}"
          BASE_TAG="${{ steps.tagname.outputs.BASE_TAG }}"

          # Ensure the follow-up label exists for triage consistency
          gh label create "$LABEL" --color "7F93FF" --description "Follow-up needed for ROCm-only commit after IFU" --repo "$TARGET_REPO" --force >/dev/null

          created_any=false
          while IFS= read -r row; do
            sha=$(jq -r '.sha' <<<"$row")
            short=$(jq -r '.short' <<<"$row")
            title=$(jq -r '.title' <<<"$row")
            authored_at=$(jq -r '.date' <<<"$row")
            login=$(jq -r '.login // empty' <<<"$row")
            author_name=$(jq -r '.author.name // "Unknown author"' <<<"$row")

            if gh issue list --repo "$TARGET_REPO" --state all --label "$LABEL" --search "$sha" --json number --limit 1 | jq -e 'length > 0' >/dev/null; then
              echo "Issue already exists for $sha; skipping."
              continue
            fi

            formatted_date=$(date -d "$authored_at" +"%m/%d/%Y" 2>/dev/null || echo "$authored_at")
            issue_title="${BASE_TAG}: IFU ${formatted_date} #${PR_NUM} (${short})"

            body=$(cat <<EOF
Commit: https://github.com/${TARGET_REPO}/commit/${sha}
Author: ${author_name}

Summary:
\`\`\`
${title}
\`\`\`

Action items:
- [ ] Review ${short} to confirm it is ROCm-only.
- [ ] Determine whether upstream sync is required.
- [ ] Close this issue once resolved.
EOF
)

            create_payload=$(jq -n --arg title "$issue_title" \
                                   --arg body "$body" \
                                   --arg label "$LABEL" \
                                   '{title: $title, body: $body, labels: [$label]}')

            response=$(printf '%s' "$create_payload" | gh api "repos/$TARGET_REPO/issues" --method POST --input -)
            issue_url=$(jq -r '.html_url' <<<"$response")
            issue_number=$(jq -r '.number' <<<"$response")

            if [ -n "$login" ]; then
              gh api "repos/$TARGET_REPO/issues/$issue_number/assignees" --method POST -f "assignees[]=$login" >/dev/null || \
                echo "::notice::Could not assign @$login to issue #$issue_number (insufficient permissions?)."
            fi

            gh project item-add --owner "$PROJECT_OWNER" --number "$PROJECT_NUMBER" --url "$issue_url" >/dev/null || \
              echo "::warning::Failed to add issue #$issue_number to project $PROJECT_OWNER/$PROJECT_NUMBER."

            echo "Created follow-up issue $issue_url for $sha."
            created_any=true
          done < <(jq -c '.[]' commits.json)

          if [ "$created_any" != true ]; then
            echo "No new issues were created."
          fi

      - name: Append rocm_base & upstream_main to PR body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Read current body
          PR="${{ steps.shas.outputs.PR_NUM }}"
          CURR=$(gh api repos/${{ github.repository }}/pulls/$PR --jq .body)
          APPEND=$'\n'"rocm_base: ${{ steps.shas.outputs.ROCM_BASE_SHA }}"$'\n'"upstream_main: ${{ steps.shas.outputs.UPSTREAM_MAIN_SHA }}"$'\n'
          NEW_BODY="${CURR}${APPEND}"

          # Write to a temp file and update PR body
          printf '%s' "$NEW_BODY" > body.txt
          gh api --method PATCH -H  "Accept: application/vnd.github+json" \
            repos/${{ github.repository }}/pulls/$PR -F body=@body.txt

